[build]
  publish = "."

[[redirects]]
  from = "/translationcore"
  to   = "/translationcore/"
  status = 301

[[redirects]]
  from = "/translation-helps"
  to   = "/translation-helps/"
  status = 301

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
